controller_manager:
  ros__parameters:
    update_rate: 100  # Hz. 4 heartbeats + 4 encoder-estimate frames read per cycle at
                       # this rate is comfortably inside 250 kbps CAN bandwidth - raise
                       # cautiously and watch CAN bus load if you push this higher.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.38   # measured: left/right wheel-center distance (track width)
    wheel_radius: 0.075      # measured: 15 cm wheel diameter / 2

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false        # false = trust the ODrive's encoder velocity feedback,
                             # not just the last commanded velocity - matters a lot on
                             # skid/scrub turns with 4 wheels
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    # --- Velocity/acceleration limits ---
    # Hardware cap is 5 turns/s per wheel = 5 * 2*pi = 31.416 rad/s (also enforced
    # independently, in turns/s, inside odrive_s1_hw_interface::write() as a second
    # line of defense).
    #   linear.x max  = wheel_radius * wheel_angular_vel_max
    #                 = 0.075 * 31.416 = 2.356 m/s
    #   angular.z max = 2 * linear.x max / wheel_separation
    #                 = 2 * 2.356 / 0.38 = 12.4 rad/s
    # The angular figure is the theoretical max when spinning in place (v=0); it's
    # very fast (~710 deg/s) for a real rover, so tune it down for teleop/Nav2 once
    # you've seen how the chassis actually behaves.
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 2.356
    linear.x.min_velocity: -2.356
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 2.0
    linear.x.min_acceleration: -2.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 12.4
    angular.z.min_velocity: -12.4
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 4.0
    angular.z.min_acceleration: -4.0
